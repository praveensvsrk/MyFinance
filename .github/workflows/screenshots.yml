name: Screenshots

# Run by hand from the Actions tab: regenerates assets/screenshots/ from the demo data
# (npm run screenshots) and commits the PNGs back to the branch it was run on.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Uses the runner's installed Chrome, as the e2e tests do.
      - run: npm run screenshots
      - name: Commit changed screenshots
        run: |
          git add assets/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screenshots"
          git push
