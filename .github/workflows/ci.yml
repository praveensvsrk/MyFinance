name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Real-statement tests skip themselves because fixtures/ is not in the repository.
      - run: npm test
      - run: npm run build
      # Builds and serves the app itself, then drives it in the runner's installed Chrome.
      - run: npm run e2e
